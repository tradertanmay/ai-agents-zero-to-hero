[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agents-zero-to-hero"
version = "0.1.0"
description = "Learn AI agents from first principles to production systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AI Agents Community" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
providers = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
